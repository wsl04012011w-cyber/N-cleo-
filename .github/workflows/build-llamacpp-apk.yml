name: Build Núcleo Chat APK (llama.cpp arm64-v8a)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      llama_cpp_ref:
        description: "Branch ou tag do ggml-org/llama.cpp (ex.: master)"
        required: false
        default: "master"
        type: string
      enable_vulkan:
        description: "Habilitar backend GPU Vulkan (experimental no Android)"
        required: false
        default: false
        type: boolean
      build_variant:
        description: "Variante do APK (debug ou release)"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - release

concurrency:
  group: android-llamacpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compile arm64-v8a APK with llama.cpp
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_NDK_VERSION: "28.2.13676358"
      CMAKE_VERSION: "3.31.6"
      ANDROID_PLATFORM_VERSION: "android-36"
      ANDROID_BUILD_TOOLS_VERSION: "36.0.0"

    steps:
      - name: Checkout Núcleo Chat
        uses: actions/checkout@v4

      - name: Clone ggml-org/llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ inputs.llama_cpp_ref || 'master' }}
          path: third_party/llama.cpp
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r28c (16KB page size), CMake & Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager \
            "platforms;${ANDROID_PLATFORM_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"
          sdkmanager "platforms;android-36.1" || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug.keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Optimized llama.cpp APK (arm64-v8a + KleidiAI)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VARIANT="${{ inputs.build_variant || 'debug' }}"
          VULKAN_FLAG="${{ inputs.enable_vulkan || false }}"

          if [ "$VARIANT" = "release" ] && [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            GRADLE_TASK="assembleRelease"
          else
            GRADLE_TASK="assembleDebug"
          fi

          gradle "$GRADLE_TASK" \
            -PenableLlamaCpp=true \
            -PenableVulkan="$VULKAN_FLAG" \
            -PllamaCppDir="$GITHUB_WORKSPACE/third_party/llama.cpp" \
            --no-daemon --stacktrace

      - name: Verify native library inside APK
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "APK gerado: $APK_PATH"
          ls -lh "$APK_PATH"
          unzip -l "$APK_PATH" | grep -E "libnucleo_llama\.so|libc\+\+_shared\.so"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nucleo-chat-llamacpp-arm64-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
